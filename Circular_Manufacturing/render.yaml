services:
  - type: web
    name: circular-material-studio
    runtime: python
    buildCommand: pip install ".[gurobi,postgres]"
    startCommand: HOST=0.0.0.0 python scripts/run_workbench.py
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: CIRCULAR_DEPLOYMENT_MODE
        value: production
      - key: CIRCULAR_AUTH_MODE
        value: bearer
      - key: CIRCULAR_API_ROLE
        value: operator
      - key: CIRCULAR_API_TOKEN_SHA256
        sync: false
      # Set this AFTER the Vercel frontend (frontend/) is deployed and its URL
      # is known, e.g. https://circular-material-studio.vercel.app -- comma-
      # separate multiple origins (preview + production). Leave unset while
      # this backend is the only thing serving the UI (web/dist same-origin).
      # See README.md "Deployment" for the full three-step order.
      - key: CIRCULAR_CORS_ORIGINS
        value: ""
