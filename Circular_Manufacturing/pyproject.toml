[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circular-battery-intelligence"
version = "1.2.1"
description = "Enterprise Circular Battery Manufacturing & Recovery Decision Intelligence Platform."
requires-python = ">=3.14,<3.15"
dependencies = [
  "scipy>=1.13","numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=6.0"]
gurobi = ["gurobipy>=13.0"]
postgres = ["psycopg[binary]>=3.2"]
data = ["openpyxl==3.1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.vercel]
entrypoint = "scripts.product_runtime:Handler"
